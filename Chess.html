<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightning Fast HTML Chess</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c2f33;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { margin-top: 0; margin-bottom: 25px; text-align: center; }

        /* Side-By-Side Layout Architecture */
        .main-layout {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 1000px;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 320px;
        }

        /* Timer UI */
        .clock-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e2124;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 26px;
            font-weight: bold;
            font-family: 'Consolas', 'Courier New', monospace;
            color: #b9bbbe;
            margin: 8px 0;
            width: 100%;
            max-width: 530px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .clock-label {
            font-family: 'Segoe UI', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #8e9297;
        }
        .active-clock {
            background: #ffffff;
            color: #23272a;
            border-color: #7289da;
        }
        .active-clock .clock-label { color: #23272a; }
        .low-time { color: #f04747 !important; }

        /* Right Sidebar Elements */
        .status-box {
            background: #1e2124;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #ffcc00;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-bottom: 4px solid #7289da;
        }

        .controls, .review-controls {
            background: #23272a;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label { font-size: 13px; color: #b9bbbe; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        
        select, button, input[type="number"] {
            padding: 10px;
            font-size: 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        select, input[type="number"] { background: #fff; color: #000; font-weight: bold; }
        button { background: #7289da; color: #fff; font-weight: bold; transition: 0.2s; }
        button:hover { background: #5b6eae; }
        
        #review-btn { background: #43b581; display: none; margin-top: 5px; }
        #review-btn:hover { background: #3ca374; }
        .nav-btn { background: #f04747; }
        .nav-btn:hover { background: #d84040; }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            cursor: pointer;
            user-select: none;
            color: #fff;
            margin: 5px 0;
        }
        
        /* Board System Styling */
        .board-wrapper {
            display: grid;
            grid-template-columns: 30px 480px;
            grid-template-rows: 480px 30px;
            background: #1e2124;
            padding: 15px 15px 5px 5px;
            border-radius: 8px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
        }
        .rank-labels {
            display: grid;
            grid-template-rows: repeat(8, 60px);
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #ffcc00;
            font-size: 16px;
            user-select: none;
        }
        .file-labels {
            grid-column: 2;
            display: grid;
            grid-template-columns: repeat(8, 60px);
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #ffcc00;
            font-size: 16px;
            user-select: none;
            padding-top: 5px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 4px solid #4a3628;
        }
        .square {
            width: 60px; height: 60px;
            display: flex; justify-content: center; align-items: center;
            font-size: 42px; cursor: pointer; position: relative; user-select: none;
            transition: box-shadow 0.4s ease-out; /* Smooth fade effect for the outline */
        }
        .light { background-color: #f0d9b5; }
        .dark { background-color: #b58863; }
        .piece { transition: transform 0.1s; }
        .white-piece { color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
        .black-piece { color: #000; text-shadow: 0 0 2px #fff, 0 0 2px #fff; }
        .selected { background-color: #a9a43a !important; }
        .valid-move::after {
            content: ''; width: 18px; height: 18px;
            background-color: rgba(0, 0, 0, 0.2); border-radius: 50%; position: absolute;
        }

        /* Distinctive outlines for player moves */
        .last-move-white {
            box-shadow: inset 0 0 0 4px #ffffff !important;
            z-index: 5;
        }
        .last-move-black {
            box-shadow: inset 0 0 0 4px #000000 !important;
            z-index: 5;
        }

        /* Review & History Panels */
        .review-panel { 
            padding: 15px; 
            border-radius: 5px; 
            background: #1e2124; 
            text-align: center; 
            font-size: 20px; 
            font-weight: bold; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-left: 5px solid transparent;
        }
        .best { color: #31a14d; border-color: #31a14d; }
        .good { color: #7bbb5e; border-color: #7bbb5e; }
        .inaccuracy { color: #f2ca5c; border-color: #f2ca5c; }
        .mistake { color: #e58f2a; border-color: #e58f2a; }
        .blunder { color: #ca3431; border-color: #ca3431; }

        /* Animation for suggested moves */
        .suggested-highlight {
            animation: pulse-suggest 1.5s infinite;
            z-index: 10;
        }

        @keyframes pulse-suggest {
            0% { box-shadow: inset 0 0 0 4px rgba(49, 161, 77, 0.8); background-color: rgba(49, 161, 77, 0.4); }
            50% { box-shadow: inset 0 0 0 6px rgba(49, 161, 77, 1); background-color: rgba(49, 161, 77, 0.7); }
            100% { box-shadow: inset 0 0 0 4px rgba(49, 161, 77, 0.8); background-color: rgba(49, 161, 77, 0.4); }
        }

        .history-section {
            background: #23272a;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .stats-container {
            display: flex;
            justify-content: space-around;
            background: #1e2124;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 13px;
        }
        .history-list {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
        }
        .history-item {
            background: #2c2f33;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            border-left: 4px solid #7289da;
        }
        .history-item-details { display: flex; flex-direction: column; gap: 2px; }
        .history-actions { display: flex; gap: 5px; }
        .btn-small { padding: 5px 8px; font-size: 12px; border-radius: 4px; background: #4f545c; width: auto; }
        .btn-small:hover { background: #686d73; }
        .btn-delete { background: #f04747; }
        .btn-delete:hover { background: #d84040; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e2124; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #7289da; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #5b6eae; }
    </style>
</head>
<body>

    <h1 id="main-title">Standard Chess (Ultra Fast Engine)</h1>
    
    <div class="main-layout">
        
        <div class="left-column">
            <div class="clock-container" id="top-clock" style="display:none;">
                <span class="clock-label" id="top-player-label">Opponent</span>
                <span id="top-time">00:00</span>
            </div>

            <div class="board-wrapper">
                <div class="rank-labels" id="rank-labels"></div>
                <div id="board" class="board"></div>
                <div class="file-labels" id="file-labels"></div>
            </div>

            <div class="clock-container" id="bottom-clock" style="display:none;">
                <span class="clock-label" id="bottom-player-label">Player</span>
                <span id="bottom-time">00:00</span>
            </div>
        </div>

        <div class="right-column">
            
            <div id="status" class="status-box">White to move</div>
            
            <div class="controls" id="game-controls">
                
                <div class="control-group">
                    <label for="time-control">Time Control</label>
                    <select id="time-control" onchange="playUiSound(); toggleCustomTime(); resetGame()">
                        <option value="0">No Timer (Casual)</option>
                        <option value="1">Bullet (1 min)</option>
                        <option value="5">Blitz (5 min)</option>
                        <option value="10" selected>Rapid (10 min)</option>
                        <option value="60">Classical (1 Hour)</option>
                        <option value="custom">Custom Time...</option>
                    </select>
                    <div id="custom-time-container" style="display:none; margin-top:5px; flex-direction:row; gap:5px;">
                        <input type="number" id="custom-hours" placeholder="Hrs" value="0" min="0" max="24" onchange="resetGame()">
                        <input type="number" id="custom-minutes" placeholder="Min" value="3" min="0" max="59" onchange="resetGame()">
                        <input type="number" id="custom-seconds" placeholder="Sec" value="0" min="0" max="59" onchange="resetGame()">
                    </div>
                </div>

                <div class="control-group">
                    <label for="mode">Game Mode</label>
                    <select id="mode" onchange="playUiSound(); toggleGameMode()">
                        <option value="friend">Play with Friend (Local)</option>
                        <option value="bot" selected>Play with Bot</option>
                    </select>
                </div>

                <div class="control-group" id="diff-container">
                    <label for="difficulty">Bot Difficulty</label>
                    <select id="difficulty" onchange="playUiSound(); resetGame()">
                        <option value="easy">Easy</option>
                        <option value="normal" selected>Normal</option>
                        <option value="hard">Hard</option>
                        <option value="impossible">Impossible</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="player-color">Play Perspective</label>
                    <select id="player-color" onchange="playUiSound(); resetGame()">
                        <option value="w">Play as White</option>
                        <option value="b">Play as Black</option>
                    </select>
                </div>

                <label class="checkbox-container">
                    <input type="checkbox" id="soundToggle" checked onchange="playUiSound()"> Enable Sounds
                </label>

                <button onclick="playUiSound(); resetGame()">Restart Game</button>
                <button id="resign-btn" onclick="playUiSound(); resignGame()" style="background: #f04747; display: none;">Resign Game</button>
                <button id="review-btn" onclick="playUiSound(); prepareAnalysis()">Analyze Game</button>
            </div>

            <div class="review-controls" id="review-controls" style="display: none;">
                <button class="nav-btn" onclick="playUiSound(); stepReview(-1)">⬅ Previous Move</button>
                <span id="review-counter" style="font-weight: bold; font-size: 18px; text-align: center; padding: 5px 0;">Move 0</span>
                <button class="nav-btn" onclick="playUiSound(); stepReview(1)">Next Move ➡</button>
                <button onclick="playUiSound(); resetGame()" style="margin-top: 10px;">Exit Analysis</button>
            </div>
            
            <div id="review-panel" class="review-panel" style="display: none;">
                <div id="opening-name" style="color: #7289da; font-size: 14px; margin-bottom: 8px;"></div>
                <span id="review-actor" style="color: white; font-size: 15px; display:block; margin-bottom: 5px;"></span>
                <span id="review-text"></span>
            </div>

            <div class="history-section" id="history-section">
                <h3 style="margin-top: 0; text-align: center; color: #ffcc00; margin-bottom: 12px; font-size: 16px;">Local Match History</h3>
                <div class="stats-container">
                    <div>White: <span id="stat-white" style="color: #43b581;">0</span></div>
                    <div>Black: <span id="stat-black" style="color: #f2ca5c;">0</span></div>
                    <div>Draws: <span id="stat-draws" style="color: #7289da;">0</span></div>
                </div>
                <div id="history-list" class="history-list"></div>
                <button onclick="playUiSound(); clearAllHistory()" style="background: #f04747; margin-top: 10px; font-size: 13px; padding: 6px;">Clear History</button>
            </div>

        </div>
    </div>

        function getOpeningName(moves) {
            let currentSequence = "";
            let bestMatch = "Standard Opening";
            for (let i = 0; i < moves.length && i < 10; i++) {
                currentSequence += (currentSequence ? " " : "") + moves[i];
                if (chessOpenings[currentSequence]) {
                    bestMatch = chessOpenings[currentSequence];
                }
            }
            return bestMatch;
        }

        /* --- SOUND ENGINE --- */
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!document.getElementById('soundToggle').checked) return;
            initAudio();

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'move') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gainNode.gain.setValueAtTime(0.5, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'capture') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                gainNode.gain.setValueAtTime(0.8, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'check') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(500, now); osc.frequency.setValueAtTime(350, now + 0.1); 
                gainNode.gain.setValueAtTime(0.4, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now); osc.stop(now + 0.35);
            } else if (type === 'end') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'button') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            }
        }

        function playUiSound() { playSound('button'); }
        function handleGameSound(moveObj) {
            if (game.in_checkmate() || game.in_draw()) playSound('end');
            else if (game.in_check()) playSound('check');
            else if (moveObj.captured) playSound('capture');
            else playSound('move');
        }

        /* --- TIMER LOGIC --- */
        function toggleCustomTime() {
            const val = document.getElementById('time-control').value;
            document.getElementById('custom-time-container').style.display = (val === 'custom') ? 'flex' : 'none';
        }

        function formatTime(ms) {
            let totalSeconds = Math.ceil(ms / 1000);
            if (totalSeconds < 0) totalSeconds = 0;
            let h = Math.floor(totalSeconds / 3600);
            let m = Math.floor((totalSeconds % 3600) / 60);
            let s = totalSeconds % 60;
            let res = '';
            if (h > 0) res += h + ':';
            res += (m < 10 && h > 0 ? '0' + m : m) + ':';
            res += (s < 10 ? '0' + s : s);
            return res;
        }

        function setupTimers() {
            clearInterval(timerInterval);
            const val = document.getElementById('time-control').value;
            let totalMs = 0;
            
            if (val === '0') {
                useTimer = false;
                document.getElementById('top-clock').style.display = 'none';
                document.getElementById('bottom-clock').style.display = 'none';
                return;
            } else if (val === 'custom') {
                const h = parseInt(document.getElementById('custom-hours').value) || 0;
                const m = parseInt(document.getElementById('custom-minutes').value) || 0;
                const s = parseInt(document.getElementById('custom-seconds').value) || 0;
                totalMs = (h * 3600 + m * 60 + s) * 1000;
                
                // Prevent setting 0 time if custom is selected; default to 1 min
                if (totalMs <= 0) totalMs = 60000; 
            } else {
                totalMs = parseInt(val) * 60 * 1000;
            }
            
            useTimer = true;
            timerWhite = totalMs;
            timerBlack = totalMs;
            
            document.getElementById('top-clock').style.display = 'flex';
            document.getElementById('bottom-clock').style.display = 'flex';
            updateClockUI();
        }

        function updateClockUI() {
            if (!useTimer) return;
            const pColor = document.getElementById('player-color').value;
            const isFlipped = (pColor === 'b');
            const mode = document.getElementById('mode').value;
            
            const topTimeEl = document.getElementById('top-time');
            const bottomTimeEl = document.getElementById('bottom-time');
            const topLabelEl = document.getElementById('top-player-label');
            const bottomLabelEl = document.getElementById('bottom-player-label');
            const topClock = document.getElementById('top-clock');
            const bottomClock = document.getElementById('bottom-clock');
            
            if (mode === 'bot') {
                topLabelEl.innerText = isFlipped ? "Bot (White)" : "Bot (Black)";
                bottomLabelEl.innerText = isFlipped ? "You (Black)" : "You (White)";
            } else {
                topLabelEl.innerText = isFlipped ? "White" : "Black";
                bottomLabelEl.innerText = isFlipped ? "Black" : "White";
            }
            
            let topTimeMs = isFlipped ? timerWhite : timerBlack;
            let bottomTimeMs = isFlipped ? timerBlack : timerWhite;

            if (isReviewMode && gameTimesWhite && gameTimesWhite[reviewIndex] !== undefined) {
                const revTimeW = gameTimesWhite[reviewIndex];
                const revTimeB = gameTimesBlack[reviewIndex];
                topTimeMs = isFlipped ? revTimeW : revTimeB;
                bottomTimeMs = isFlipped ? revTimeB : revTimeW;
            }

            topTimeEl.innerText = formatTime(topTimeMs);
            bottomTimeEl.innerText = formatTime(bottomTimeMs);
            
            topClock.classList.remove('active-clock');
            bottomClock.classList.remove('active-clock');
            topTimeEl.classList.remove('low-time');
            bottomTimeEl.classList.remove('low-time');
            
            if (gameActive && !game.game_over() && !isReviewMode && !isAnalyzing) {
                if (game.turn() === 'w') {
                    if (isFlipped) topClock.classList.add('active-clock');
                    else bottomClock.classList.add('active-clock');
                } else {
                    if (isFlipped) bottomClock.classList.add('active-clock');
                    else topClock.classList.add('active-clock');
                }
            }
            
            if (topTimeMs <= 30000 && topTimeMs > 0) topTimeEl.classList.add('low-time');
            if (bottomTimeMs <= 30000 && bottomTimeMs > 0) bottomTimeEl.classList.add('low-time');
        }

        function startTimer() {
            if (!useTimer || gameActive) return;
            gameActive = true;
            lastUpdateTime = Date.now();

            timerInterval = setInterval(() => {
                if (!gameActive || game.game_over() || isReviewMode || isAnalyzing) {
                    clearInterval(timerInterval);
                    return;
                }
                
                const now = Date.now();
                const delta = now - lastUpdateTime;
                lastUpdateTime = now;

                if (game.turn() === 'w') {
                    timerWhite -= delta;
                    if (timerWhite <= 0) { timerWhite = 0; handleTimeout('w'); }
                } else {
                    timerBlack -= delta;
                    if (timerBlack <= 0) { timerBlack = 0; handleTimeout('b'); }
                }
                updateClockUI();
            }, 100); 
            updateClockUI();
        }

        function updateTimeOnMove() {
            if (!useTimer || !gameActive) return;
            const now = Date.now();
            const delta = now - lastUpdateTime;
            lastUpdateTime = now;

            if (game.turn() === 'w') {
                timerWhite -= delta;
                if (timerWhite <= 0) { timerWhite = 0; handleTimeout('w'); }
            } else {
                timerBlack -= delta;
                if (timerBlack <= 0) { timerBlack = 0; handleTimeout('b'); }
            }
            updateClockUI();
        }

        function handleTimeout(loserColor) {
            gameActive = false;
            clearInterval(timerInterval);
            playSound('end');
            
            let winnerColorStr = loserColor === 'w' ? 'Black' : 'White';
            
            statusEl.innerHTML = `Game over, ${winnerColorStr} wins on time.`;
            document.getElementById('review-btn').style.display = "block"; 
            document.getElementById('resign-btn').style.display = "none";
            
            if (!gameSaved) {
                gameSaved = true;
                saveGameToHistory(`${winnerColorStr} Wins (Timeout)`);
            }
            updateClockUI();
        }

        function resignGame() {
            if (game.game_over() || isReviewMode || isAnalyzing || !gameActive) return;
            
            gameActive = false;
            clearInterval(timerInterval);
            playSound('end');
            
            const playerColor = document.getElementById('player-color').value;
            let winnerColorStr = playerColor === 'w' ? 'Black' : 'White';
            let loserColorStr = playerColor === 'w' ? 'White' : 'Black';
            
            statusEl.innerHTML = `Game over, ${loserColorStr} resigned. ${winnerColorStr} wins.`;
            
            document.getElementById('resign-btn').style.display = "none";
            document.getElementById('review-btn').style.display = "block"; 
            
            if (!gameSaved) {
                gameSaved = true;
                saveGameToHistory(`${winnerColorStr} Wins (Resignation)`);
            }
            updateClockUI();
        }

        /* --- GAME LOGIC --- */
        function toggleGameMode() {
            const mode = document.getElementById('mode').value;
            document.getElementById('diff-container').style.display = (mode === 'bot') ? 'flex' : 'none';
            resetGame();
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            validTargetSquares = [];
            isReviewMode = false;
            isAnalyzing = false;
            gameSaved = false;
            gameActive = false;
            lastMoveTimestamp = Date.now();
            
            setupTimers();

            gameFens = [game.fen()];
            gameEvals = [0]; 
            gameNotationMoves = [""];
            gameLastMoves = [null];
            gameTimesWhite = [timerWhite];
            gameTimesBlack = [timerBlack];
            suggestedMoves = [];

            document.getElementById('main-title').innerText = "Standard Chess (Ultra Fast Engine)";
            document.getElementById('game-controls').style.display = "flex";
            document.getElementById('review-controls').style.display = "none";
            document.getElementById('review-btn').style.display = "none";
            document.getElementById('resign-btn').style.display = "block"; 
            reviewPanelEl.style.display = "none";
            historySectionEl.style.display = "flex";
            
            drawBoard();
            updateStatus();
            updateHistoryUI();

            const mode = document.getElementById('mode').value;
            const playerColor = document.getElementById('player-color').value;
            if (mode === 'bot' && playerColor === 'b' && game.turn() === 'w') {
                makeBotMove();
            }
        }

        function recordMove(moveObj) {
            gameFens.push(game.fen());
            gameNotationMoves.push(moveObj.san);
            gameLastMoves.push({ from: moveObj.from, to: moveObj.to, color: moveObj.color });
            gameTimesWhite.push(timerWhite);
            gameTimesBlack.push(timerBlack);
            lastMoveTimestamp = Date.now(); // Record exact timestamp for the 1s outline
            let currentEval = minimax(2, -Infinity, Infinity, game.turn() === 'w');
            gameEvals.push(currentEval);
        }

        function drawBoard() {
            boardEl.innerHTML = '';
            const board = game.board(); 
            const pColor = document.getElementById('player-color').value;
            const isFlipped = (pColor === 'b');
            
            const rankLabelsEl = document.getElementById('rank-labels');
            const fileLabelsEl = document.getElementById('file-labels');
            let ranksHTML = '', filesHTML = '';
            for(let i = 0; i < 8; i++) {
                ranksHTML += `<div>${isFlipped ? (i + 1) : (8 - i)}</div>`;
                const fileStr = String.fromCharCode('a'.charCodeAt(0) + (isFlipped ? (7 - i) : i));
                filesHTML += `<div>${fileStr}</div>`;
            }
            rankLabelsEl.innerHTML = ranksHTML;
            fileLabelsEl.innerHTML = filesHTML;

            const currentIndex = isReviewMode ? reviewIndex : (gameFens.length - 1);
            const lastMove = gameLastMoves[currentIndex];
            const timeSinceMove = Date.now() - lastMoveTimestamp;
            
            // Should we show the outline?
            // In review mode, always show it. In live play, only show if less than 1000ms has passed.
            let showOutline = isReviewMode || isAnalyzing || timeSinceMove <= 1000;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const chessJsRow = isFlipped ? (7 - r) : r;
                    const chessJsCol = isFlipped ? (7 - c) : c;
                    
                    const fileChar = String.fromCharCode('a'.charCodeAt(0) + chessJsCol);
                    const rankChar = 8 - chessJsRow;
                    const squareId = fileChar + rankChar;
                    
                    const square = document.createElement('div');
                    const isLight = (chessJsCol + rankChar) % 2 === 0;
                    
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.id = squareId;
                    
                    if (selectedSquare === squareId) square.classList.add('selected');
                    if (validTargetSquares.includes(squareId)) square.classList.add('valid-move');
                    
                    // Apply white/black move outlines
                    if (lastMove && (squareId === lastMove.from || squareId === lastMove.to) && showOutline) {
                        if (lastMove.color === 'w') {
                            square.classList.add('last-move-white');
                        } else {
                            square.classList.add('last-move-black');
                        }
                        
                        // Set timeout to remove the outline class smoothly EXACTLY at the 1 second mark during live play
                        if (!isReviewMode && !isAnalyzing) {
                            setTimeout(() => {
                                if (document.getElementById(squareId)) {
                                    document.getElementById(squareId).classList.remove('last-move-white');
                                    document.getElementById(squareId).classList.remove('last-move-black');
                                }
                            }, 1000 - timeSinceMove);
                        }
                    }

                    const piece = board[chessJsRow][chessJsCol];
                    if (piece) {
                        const pieceSpan = document.createElement('span');
                        pieceSpan.className = `piece ${piece.color === 'w' ? 'white-piece' : 'black-piece'}`;
                        pieceSpan.innerHTML = piecesMap[piece.type];
                        square.appendChild(pieceSpan);
                    }
                    
                    if(!isReviewMode && !isAnalyzing) {
                        square.onclick = () => handleSquareClick(squareId);
                    }
                    boardEl.appendChild(square);
                }
            }
        }

        function handleSquareClick(squareId) {
            initAudio(); 
            if (game.game_over() || isReviewMode || isAnalyzing || (useTimer && (timerWhite === 0 || timerBlack === 0))) return;
            
            const mode = document.getElementById('mode').value;
            const playerColor = document.getElementById('player-color').value;
            
            if (mode === 'bot' && game.turn() !== playerColor) return; 

            const pieceOnSquare = game.get(squareId);

            if (selectedSquare && validTargetSquares.includes(squareId)) {
                if (useTimer && gameActive) updateTimeOnMove();

                const moveResult = game.move({ from: selectedSquare, to: squareId, promotion: 'q' });
                
                if (moveResult) {
                    recordMove(moveResult); 
                    handleGameSound(moveResult);
                    if (useTimer && !gameActive) startTimer();
                }

                selectedSquare = null;
                validTargetSquares = [];
                drawBoard();
                updateStatus();
                updateClockUI();

                if (mode === 'bot' && !game.game_over()) {
                    makeBotMove();
                }
            } else {
                if (pieceOnSquare && pieceOnSquare.color === game.turn()) {
                    selectedSquare = squareId;
                    validTargetSquares = game.moves({ square: squareId, verbose: true }).map(m => m.to);
                } else {
                    selectedSquare = null;
                    validTargetSquares = [];
                }
                drawBoard(); // Redraws board to show valid squares
            }
        }

        function updateStatus() {
            if (useTimer && (timerWhite === 0 || timerBlack === 0)) return; 

            let statusHTML = '';
            let moveColor = game.turn() === 'w' ? 'White' : 'Black';

            if (game.in_checkmate()) {
                statusHTML = `Game over, ${moveColor} is in checkmate.`;
                document.getElementById('review-btn').style.display = "block"; 
                document.getElementById('resign-btn').style.display = "none";
                gameActive = false;
                if(!gameSaved) {
                    gameSaved = true;
                    saveGameToHistory(game.turn() === 'w' ? 'Black Wins' : 'White Wins');
                }
            }
            else if (game.in_draw()) {
                statusHTML = 'Game over, drawn position.';
                document.getElementById('review-btn').style.display = "block"; 
                document.getElementById('resign-btn').style.display = "none";
                gameActive = false;
                if(!gameSaved) {
                    gameSaved = true;
                    saveGameToHistory('Draw');
                }
            }
            else {
                statusHTML = `${moveColor} to move`;
                if (game.in_check()) statusHTML += ' (Check!)';
            }

            // Real-time Opening Tracker for live matching sequence (Both Teams)
            let currentMoves = gameNotationMoves.slice(1);
            if (currentMoves.length > 0) {
                let openingName = getOpeningName(currentMoves);
                statusHTML += `<div style="color: #7289da; font-size: 14px; margin-top: 6px; font-weight: normal;">Opening: ${openingName}</div>`;
            }

            statusEl.innerHTML = statusHTML;
        }

        /* --- HISTORY LOGIC --- */
        function saveGameToHistory(resultText) {
            const modeSelect = document.getElementById('mode').value;
            const playerSide = document.getElementById('player-color').value === 'w' ? 'White' : 'Black';
            const setupMode = modeSelect === 'friend' 
                ? `Local (View: ${playerSide})` 
                : `Bot (${document.getElementById('difficulty').value})`;
            
            const matchRecord = {
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                mode: setupMode,
                result: resultText,
                fens: [...gameFens],
                evals: [...gameEvals],
                moves: [...gameNotationMoves],
                lastMoves: [...gameLastMoves],
                timesWhite: [...gameTimesWhite],
                timesBlack: [...gameTimesBlack],
                suggestedMoves: []
            };

            let history = JSON.parse(localStorage.getItem('html_chess_history')) || [];
            history.unshift(matchRecord);
            localStorage.setItem('html_chess_history', JSON.stringify(history));
            updateHistoryUI();
        }

        function updateHistoryUI() {
            const history = JSON.parse(localStorage.getItem('html_chess_history')) || [];
            const listEl = document.getElementById('history-list');
            
            let whiteWins = 0, blackWins = 0, draws = 0;
            listEl.innerHTML = '';

            if (history.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; color:#99aab5; font-size:13px; padding: 15px;">No matches found in history.</div>';
            }

            history.forEach((match, index) => {
                if (match.result.includes('White Wins')) whiteWins++;
                else if (match.result.includes('Black Wins')) blackWins++;
                else if (match.result === 'Draw') draws++;

                const item = document.createElement('div');
                item.className = 'history-item';
                
                if (match.result.includes('White Wins')) item.style.borderColor = '#43b581';
                else if (match.result.includes('Black Wins')) item.style.borderColor = '#f2ca5c';
                else item.style.borderColor = '#7289da';

                item.innerHTML = `
                    <div class="history-item-details">
                        <strong style="color: #ffcc00; font-size: 14px;">${match.result}</strong>
                        <span style="font-size:11px; color:#b9bbbe;">${match.mode} • ${match.date}</span>
                    </div>
                    <div class="history-actions">
                        <button class="btn-small" onclick="playUiSound(); reviewPastGame(${index})">Rev</button>
                        <button class="btn-small btn-delete" onclick="playUiSound(); deleteGameFromHistory(${index})">Del</button>
                    </div>
                `;
                listEl.appendChild(item);
            });

            document.getElementById('stat-white').innerText = whiteWins;
            document.getElementById('stat-black').innerText = blackWins;
            document.getElementById('stat-draws').innerText = draws;
        }

        function deleteGameFromHistory(index) {
            let history = JSON.parse(localStorage.getItem('html_chess_history')) || [];
            history.splice(index, 1);
            localStorage.setItem('html_chess_history', JSON.stringify(history));
            updateHistoryUI();
        }

        function clearAllHistory() {
            if (confirm("Are you sure you want to permanently erase all local game history records?")) {
                localStorage.removeItem('html_chess_history');
                updateHistoryUI();
            }
        }

        /* --- PRE-CALCULATE MISTAKES LOGIC --- */
        function prepareAnalysis(isFromHistory = false, historyIndex = -1) {
            if (isAnalyzing || gameFens.length <= 1) return;
            isAnalyzing = true;
            gameActive = false;
            clearInterval(timerInterval);
            
            document.getElementById('main-title').innerText = "Game Engine Working...";
            document.getElementById('game-controls').style.display = "none";
            document.getElementById('review-controls').style.display = "none";
            historySectionEl.style.display = "none";
            reviewPanelEl.style.display = "none";
            
            suggestedMoves = new Array(gameFens.length).fill(null);
            let i = 1;

            // Non-blocking async loop to find all mistakes and calculate best moves instantly
            function analyzeNextMove() {
                if (i >= gameFens.length) {
                    isAnalyzing = false;
                    
                    // Save the processed data back into the game history so we don't need to recalculate
                    let history = JSON.parse(localStorage.getItem('html_chess_history')) || [];
                    if (isFromHistory && historyIndex !== -1 && history[historyIndex]) {
                        history[historyIndex].suggestedMoves = suggestedMoves;
                    } else if (gameSaved && history.length > 0) {
                        history[0].suggestedMoves = suggestedMoves;
                    }
                    localStorage.setItem('html_chess_history', JSON.stringify(history));

                    startReview();
                    return;
                }

                let percent = Math.round((i / (gameFens.length - 1)) * 100);
                statusEl.innerHTML = `Analyzing Game for Mistakes... ${percent}%`;

                game.load(gameFens[i - 1]);
                let turnBefore = game.turn();
                
                let evalBefore = gameEvals[i - 1];
                let evalAfter = gameEvals[i];
                let evalDiff = (turnBefore === 'w') ? (evalBefore - evalAfter) : (evalAfter - evalBefore);
                let pawnDiff = evalDiff / 10;

                // If the move was an inaccuracy, mistake, or blunder, figure out the best alternative
                if (pawnDiff > 1.5) {
                    suggestedMoves[i] = suggestBestMove(gameFens[i - 1]);
                }

                i++;
                setTimeout(analyzeNextMove, 15); // Yield 15ms so the progress bar visually updates 
            }
            analyzeNextMove();
        }

        /* --- INSTANT REVIEW LOGIC --- */
        function reviewPastGame(index) {
            let history = JSON.parse(localStorage.getItem('html_chess_history')) || [];
            let match = history[index];
            if (!match) return;

            gameFens = match.fens;
            gameEvals = match.evals;
            gameNotationMoves = match.moves;
            gameLastMoves = match.lastMoves || new Array(gameFens.length).fill(null);
            gameTimesWhite = match.timesWhite || new Array(gameFens.length).fill(0);
            gameTimesBlack = match.timesBlack || new Array(gameFens.length).fill(0);
            
            useTimer = gameTimesWhite.length > 0 && gameTimesWhite[0] > 0;
            if (useTimer) {
                document.getElementById('top-clock').style.display = 'flex';
                document.getElementById('bottom-clock').style.display = 'flex';
            } else {
                document.getElementById('top-clock').style.display = 'none';
                document.getElementById('bottom-clock').style.display = 'none';
            }

            // If the game was already analyzed in the past, just load it instantly
            if (match.suggestedMoves && match.suggestedMoves.length === gameFens.length) {
                suggestedMoves = match.suggestedMoves;
                startReview();
            } else {
                // Otherwise, calculate the mistakes right now before opening it
                prepareAnalysis(true, index); 
            }
        }

        function startReview() {
            isReviewMode = true;
            gameActive = false;
            clearInterval(timerInterval);
            reviewIndex = 0; 
            
            document.getElementById('main-title').innerText = "Game Analysis";
            document.getElementById('game-controls').style.display = "none";
            document.getElementById('review-controls').style.display = "flex";
            historySectionEl.style.display = "none";
            
            selectedSquare = null;
            validTargetSquares = [];
            
            updateClockUI();
            renderReviewState();
        }

        function stepReview(direction) {
            reviewIndex += direction;
            if (reviewIndex < 0) reviewIndex = 0;
            if (reviewIndex >= gameFens.length) reviewIndex = gameFens.length - 1;
            renderReviewState();
        }

        function renderReviewState() {
            game.load(gameFens[reviewIndex]);
            drawBoard();
            
            document.getElementById('review-counter').innerText = `Move ${reviewIndex} of ${gameFens.length - 1}`;

            let currentMoves = gameNotationMoves.slice(1, reviewIndex + 1);
            let openingName = getOpeningName(currentMoves);
            document.getElementById('opening-name').innerText = reviewIndex > 0 ? `Opening: ${openingName}` : "";

            if (reviewIndex === 0) {
                reviewPanelEl.style.display = "block";
                reviewActorEl.innerText = "Game Start";
                reviewTextEl.innerHTML = "Starting Position";
                reviewPanelEl.className = "review-panel";
                statusEl.innerHTML = `Opening Position<div style="color: #7289da; font-size: 14px; margin-top: 6px; font-weight: normal;">Opening: ${openingName}</div>`;
                if (useTimer && gameTimesWhite && gameTimesWhite[reviewIndex] !== undefined) {
                    let timeStr = `White: ${formatTime(gameTimesWhite[reviewIndex])} | Black: ${formatTime(gameTimesBlack[reviewIndex])}`;
                    reviewTextEl.innerHTML += `<br><span style="font-size: 13px; color: #ffcc00; margin-top: 6px; display: inline-block;">⏱️ ${timeStr}</span>`;
                }
                updateClockUI();
                return;
            }

            // Figure out whose turn it was previously to properly assign the mistake to White or Black
            game.load(gameFens[reviewIndex - 1]);
            let turnBefore = game.turn();
            
            // Immediately restore the board state to the current move visually
            game.load(gameFens[reviewIndex]);

            let evalBefore = gameEvals[reviewIndex - 1];
            let evalAfter = gameEvals[reviewIndex];
            let rawMovePlayed = gameNotationMoves[reviewIndex]; 

            let evalDiff = (turnBefore === 'w') ? (evalBefore - evalAfter) : (evalAfter - evalBefore);
            let pawnDiff = evalDiff / 10;
            let feedback = "", fClass = "";
            
            if (pawnDiff <= 0.5) { feedback = "Best Move ⭐"; fClass = "best"; }
            else if (pawnDiff <= 1.5) { feedback = "Good 👍"; fClass = "good"; }
            else if (pawnDiff <= 3.0) { feedback = "Inaccuracy ⁉️"; fClass = "inaccuracy"; }
            else if (pawnDiff <= 5.0) { feedback = "Mistake ❓"; fClass = "mistake"; }
            else { feedback = "Blunder! ❌"; fClass = "blunder"; }
            
            reviewPanelEl.style.display = "block";
            reviewActorEl.innerText = turnBefore === 'w' ? `White Played: ${rawMovePlayed}` : `Black Played: ${rawMovePlayed}`;
            reviewPanelEl.className = `review-panel ${fClass}`;
            statusEl.innerHTML = `Reviewing Move ${reviewIndex}<div style="color: #7289da; font-size: 14px; margin-top: 6px; font-weight: normal;">Opening: ${openingName}</div>`;

            // Because we pre-calculated the best moves after the game ended, we can load it instantly
            if (pawnDiff > 1.5) {
                let betterMove = suggestedMoves[reviewIndex] || "Unknown";
                let moveDesc = "";

                // --- ANIMATION & DESCRIPTION LOGIC ---
                if (betterMove !== "Unknown" && betterMove !== "None") {
                    try {
                        // Temporarily load the board state *before* the mistake to parse the suggestion
                        game.load(gameFens[reviewIndex - 1]);
                        let parsedMove = game.move(betterMove);
                        
                        // Restore the visual board state immediately so the view isn't broken
                        game.load(gameFens[reviewIndex]);
                        
                        if (parsedMove) {
                            // Apply the pulsing animation class to the 'from' and 'to' squares
                            let fromSquare = document.getElementById(parsedMove.from);
                            let toSquare = document.getElementById(parsedMove.to);
                            if (fromSquare) fromSquare.classList.add('suggested-highlight');
                            if (toSquare) toSquare.classList.add('suggested-highlight');

                            // Generate clean, readable English translations for algebraic codes
                            const pieceNames = { 'p': 'Pawn', 'n': 'Knight', 'b': 'Bishop', 'r': 'Rook', 'q': 'Queen', 'k': 'King' };
                            if (parsedMove.san === 'O-O') {
                                moveDesc = "Kingside Castle";
                            } else if (parsedMove.san === 'O-O-O') {
                                moveDesc = "Queenside Castle";
                            } else {
                                let pName = pieceNames[parsedMove.piece] || "Piece";
                                if (parsedMove.captured) {
                                    let capName = pieceNames[parsedMove.captured] || "Piece";
                                    moveDesc = `${pName} takes ${capName} on ${parsedMove.to}`;
                                } else {
                                    moveDesc = `${pName} to ${parsedMove.to}`;
                                }
                            }
                        }
                    } catch(e) {
                        // Failsafe: if parse fails, just make sure the board state is restored
                        game.load(gameFens[reviewIndex]); 
                    }
                }
                // --- END ANIMATION LOGIC ---
                
                let descHTML = moveDesc ? `<br><span style="font-size: 13px; color: #ffcc00; font-weight: 500;">💡 ${moveDesc}</span>` : "";
                reviewTextEl.innerHTML = feedback + `<br><span style="font-size: 14px; color: #b9bbbe;">Suggested Move: <strong style="color: #fff;">${betterMove}</strong></span>` + descHTML;
                
            } else {
                reviewTextEl.innerHTML = feedback;
            }

            if (useTimer && gameTimesWhite && gameTimesWhite[reviewIndex] !== undefined) {
                let timeStr = `White: ${formatTime(gameTimesWhite[reviewIndex])} | Black: ${formatTime(gameTimesBlack[reviewIndex])}`;
                reviewTextEl.innerHTML += `<br><span style="font-size: 13px; color: #ffcc00; margin-top: 6px; display: inline-block;">⏱️ ${timeStr}</span>`;
            }
            updateClockUI();
        }

        /* --- BEST MOVE ENGINE (OPTIMIZED WITH ALPHA-BETA) --- */
        function suggestBestMove(previousFen) {
            let currentReviewFen = game.fen();
            game.load(previousFen); 

            let moves = game.moves();
            if (moves.length === 0) {
                game.load(currentReviewFen);
                return "None";
            }

            moves.sort((a, b) => (b.includes('x') ? 1 : 0) - (a.includes('x') ? 1 : 0));

            let bestMove = moves[0];
            let isWhiteTurn = game.turn() === 'w';
            let bestVal = isWhiteTurn ? -Infinity : Infinity;

            let alpha = -Infinity;
            let beta = Infinity;

            for (let i = 0; i < moves.length; i++) {
                game.move(moves[i]);
                let val = minimax(1, alpha, beta, !isWhiteTurn); 
                game.undo();

                if (isWhiteTurn) {
                    if (val > bestVal) { bestVal = val; bestMove = moves[i]; }
                    alpha = Math.max(alpha, bestVal); 
                } else {
                    if (val < bestVal) { bestVal = val; bestMove = moves[i]; }
                    beta = Math.min(beta, bestVal); 
                }
            }

            game.load(currentReviewFen); 
            return bestMove;
        }

        /* --- BOT AI LOGIC --- */
        function makeBotMove() {
            if (game.game_over()) return;
            statusEl.innerHTML = "Bot is thinking...";

            const difficulty = document.getElementById('difficulty').value;
            
            let thinkDelay = 1000;
            if (difficulty === 'normal') thinkDelay = 1500;
            if (difficulty === 'hard') thinkDelay = 2000;
            if (difficulty === 'impossible') thinkDelay = 2500;

            setTimeout(() => {
                if (game.game_over() || isReviewMode || isAnalyzing) return;
                
                const moves = game.moves(); 
                if (moves.length === 0) return;

                moves.sort((a, b) => (b.includes('x') ? 1 : 0) - (a.includes('x') ? 1 : 0));
                let bestMove = null;

                if (difficulty === 'easy') {
                    bestMove = moves[Math.floor(Math.random() * moves.length)];
                } else {
                    let depth = 1; 
                    if (difficulty === 'hard') depth = 2;
                    if (difficulty === 'impossible') depth = 3; 

                    const isBotWhite = game.turn() === 'w';
                    let bestVal = isBotWhite ? -Infinity : Infinity; 
                    
                    for (let i = 0; i < moves.length; i++) {
                        game.move(moves[i]);
                        
                        let boardVal = minimax(depth - 1, -Infinity, Infinity, !isBotWhite);
                        game.undo();
                        
                        if (isBotWhite) {
                            if (boardVal > bestVal) {
                                bestVal = boardVal;
                                bestMove = moves[i];
                            }
                        } else {
                            if (boardVal < bestVal) {
                                bestVal = boardVal;
                                bestMove = moves[i];
                            }
                        }
                    }
                }

                if (useTimer && gameActive) updateTimeOnMove();

                const botMoveResult = game.move(bestMove);
                if (botMoveResult) {
                    recordMove(botMoveResult); 
                    handleGameSound(botMoveResult);
                    if (useTimer && !gameActive) startTimer();
                }

                drawBoard();
                updateStatus();
                updateClockUI();
            }, thinkDelay);
        }

        function minimax(depth, alpha, beta, isMaximizingPlayer) {
            if (depth === 0 || game.game_over()) return evaluateBoard();

            const moves = game.moves();
            moves.sort((a, b) => (b.includes('x') ? 1 : 0) - (a.includes('x') ? 1 : 0));

            if (isMaximizingPlayer) {
                let bestVal = -Infinity;
                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    bestVal = Math.max(bestVal, minimax(depth - 1, alpha, beta, false));
                    game.undo();
                    alpha = Math.max(alpha, bestVal);
                    if (beta <= alpha) break; 
                }
                return bestVal;
            } else {
                let minVal = Infinity;
                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    minVal = Math.min(minVal, minimax(depth - 1, alpha, beta, true));
                    game.undo();
                    beta = Math.min(beta, minVal);
                    if (beta <= alpha) break; 
                }
                return minVal;
            }
        }

        function evaluateBoard() {
            let totalEvaluation = 0;
            for (let i = 0; i < 64; i++) {
                const sq = SQUARES[i];
                const piece = game.get(sq);
                if (piece) totalEvaluation += getPieceValue(piece, sq);
            }
            return totalEvaluation;
        }

        function getPieceValue(piece, sq) {
            const pieceValues = { 'p': 10, 'n': 30, 'b': 30, 'r': 50, 'q': 90, 'k': 900 };
            let val = pieceValues[piece.type];
            
            if (piece.type !== 'k') {
                const c = sq.charCodeAt(0) - 97; 
                const r = 8 - parseInt(sq[1]);   
                let centerBonus = (3.5 - Math.abs(3.5 - r)) + (3.5 - Math.abs(3.5 - c));
                val += centerBonus * 0.5;
            }
            return piece.color === 'w' ? val : -val;
        }

        setupTimers();
        lastMoveTimestamp = Date.now();
        gameFens = [game.fen()];
        gameEvals = [0];
        gameNotationMoves = [""];
        gameLastMoves = [null];
        gameTimesWhite = [timerWhite];
        gameTimesBlack = [timerBlack];
        drawBoard();
        updateHistoryUI();
    </script>
