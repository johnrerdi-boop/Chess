<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightning Fast HTML Chess - Ultimate Grandmaster Edition</title>
    <!-- Chess logic and PeerJS for Online Multiplayer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c2f33;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { margin-top: 0; margin-bottom: 25px; text-align: center; }

        .main-layout {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 1000px;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 320px;
        }

        .clock-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e2124;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 26px;
            font-weight: bold;
            font-family: 'Consolas', 'Courier New', monospace;
            color: #b9bbbe;
            margin: 8px 0;
            width: 100%;
            max-width: 530px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .clock-label {
            font-family: 'Segoe UI', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #8e9297;
        }
        .active-clock {
            background: #ffffff;
            color: #23272a;
            border-color: #7289da;
        }
        .active-clock .clock-label { color: #23272a; }
        .low-time { color: #f04747 !important; }

        .status-box {
            background: #1e2124;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #ffcc00;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-bottom: 4px solid #7289da;
        }

        .controls, .review-controls {
            background: #23272a;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label { font-size: 13px; color: #b9bbbe; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        
        select, button, input[type="text"], input[type="number"] {
            padding: 10px;
            font-size: 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        select, input[type="text"], input[type="number"] { background: #fff; color: #000; font-weight: bold; }
        input[type="text"] { cursor: text; }
        
        button { background: #7289da; color: #fff; font-weight: bold; transition: 0.2s; }
        button:hover { background: #5b6eae; }
        
        #review-btn { background: #43b581; display: none; margin-top: 5px; }
        #review-btn:hover { background: #3ca374; }
        .nav-btn { background: #f04747; }
        .nav-btn:hover { background: #d84040; }

        .btn-small { padding: 5px 8px; font-size: 12px; border-radius: 4px; background: #4f545c; width: auto; cursor: pointer;}
        .btn-small:hover { background: #686d73; }

        .online-panel {
            background: #2c2f33;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #7289da;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            cursor: pointer;
            user-select: none;
            color: #fff;
            margin: 5px 0;
        }
        
        .board-wrapper {
            display: grid;
            grid-template-columns: 30px 480px;
            grid-template-rows: 480px 30px;
            background: #1e2124;
            padding: 15px 15px 5px 5px;
            border-radius: 8px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
        }
        .rank-labels {
            display: grid;
            grid-template-rows: repeat(8, 60px);
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #ffcc00;
            font-size: 16px;
            user-select: none;
        }
        .file-labels {
            grid-column: 2;
            display: grid;
            grid-template-columns: repeat(8, 60px);
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #ffcc00;
            font-size: 16px;
            user-select: none;
            padding-top: 5px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 4px solid #4a3628;
        }
        .square {
            width: 60px; height: 60px;
            display: flex; justify-content: center; align-items: center;
            font-size: 42px; cursor: pointer; position: relative; user-select: none;
            transition: box-shadow 0.4s ease-out;
        }
        .light { background-color: #f0d9b5; }
        .dark { background-color: #b58863; }
        .piece { transition: transform 0.1s; }
        .white-piece { color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
        .black-piece { color: #000; text-shadow: 0 0 2px #fff, 0 0 2px #fff; }
        .selected { background-color: #a9a43a !important; }
        .valid-move::after {
            content: ''; width: 18px; height: 18px;
            background-color: rgba(0, 0, 0, 0.2); border-radius: 50%; position: absolute;
        }

        .last-move-white { box-shadow: inset 0 0 0 4px #ffffff !important; z-index: 5; }
        .last-move-black { box-shadow: inset 0 0 0 4px #000000 !important; z-index: 5; }

        .review-panel { 
            padding: 15px; 
            border-radius: 5px; 
            background: #1e2124; 
            text-align: center; 
            font-size: 20px; 
            font-weight: bold; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-left: 5px solid transparent;
        }
        .best { color: #31a14d; border-color: #31a14d; }
        .good { color: #7bbb5e; border-color: #7bbb5e; }
        .inaccuracy { color: #f2ca5c; border-color: #f2ca5c; }
        .mistake { color: #e58f2a; border-color: #e58f2a; }
        .blunder { color: #ca3431; border-color: #ca3431; }

        .suggested-highlight { animation: pulse-suggest 1.5s infinite; z-index: 10; }
        @keyframes pulse-suggest {
            0% { box-shadow: inset 0 0 0 4px rgba(49, 161, 77, 0.8); background-color: rgba(49, 161, 77, 0.4); }
            50% { box-shadow: inset 0 0 0 6px rgba(49, 161, 77, 1); background-color: rgba(49, 161, 77, 0.7); }
            100% { box-shadow: inset 0 0 0 4px rgba(49, 161, 77, 0.8); background-color: rgba(49, 161, 77, 0.4); }
        }

        .history-section {
            background: #23272a;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .stats-container {
            display: flex; justify-content: space-around; background: #1e2124;
            padding: 10px; border-radius: 5px; margin-bottom: 12px; font-weight: bold; font-size: 13px;
        }
        .history-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; }
        .history-item { background: #2c2f33; padding: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; border-left: 4px solid #7289da; }
        .history-item-details { display: flex; flex-direction: column; gap: 2px; }
        .history-actions { display: flex; gap: 5px; }
        .btn-delete { background: #f04747; }
        .btn-delete:hover { background: #d84040; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e2124; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #7289da; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #5b6eae; }
    </style>
</head>
<body>

    <h1 id="main-title">Standard Chess (Tactical Grandmaster Engine)</h1>
    
    <div class="main-layout">
        
        <div class="left-column">
            <div class="clock-container" id="top-clock" style="display:none;">
                <span class="clock-label" id="top-player-label">Opponent</span>
                <span id="top-time">00:00</span>
            </div>

            <div class="board-wrapper">
                <div class="rank-labels" id="rank-labels"></div>
                <div id="board" class="board"></div>
                <div class="file-labels" id="file-labels"></div>
            </div>

            <div class="clock-container" id="bottom-clock" style="display:none;">
                <span class="clock-label" id="bottom-player-label">Player</span>
                <span id="bottom-time">00:00</span>
            </div>
        </div>

        <div class="right-column">
            
            <div id="status" class="status-box">White to move</div>
            
            <div class="controls" id="game-controls">
                
                <div class="control-group">
                    <label for="mode">Game Mode</label>
                    <select id="mode" onchange="playUiSound(); toggleGameMode()">
                        <option value="friend">Local Friend (Same Screen)</option>
                        <option value="bot" selected>Play with Bot</option>
                        <option value="online">Play Online (P2P WiFi)</option>
                    </select>
                </div>

                <div class="online-panel" id="online-container" style="display:none;">
                    <label style="color: #ffcc00; margin-bottom: 5px;">Online Connection</label>
                    <div style="font-size: 13px; color: #b9bbbe; display:flex; justify-content: space-between; align-items: center;">
                        <span>Your ID: <span id="my-peer-id" style="color:#fff;font-weight:bold;">Loading...</span></span>
                        <button onclick="copyPeerId()" class="btn-small" style="margin: 0;">Copy</button>
                    </div>
                    <input type="text" id="friend-id-input" placeholder="Paste Friend's ID here">
                    <button onclick="playUiSound(); connectToFriend()" style="background: #43b581;">Send Duel Request</button>
                    
                    <!-- Duel Request Popup Context -->
                    <div id="duel-request-panel" style="display: none; background: #1e2124; padding: 12px; border-radius: 6px; border: 2px dashed #f2ca5c; margin-top: 10px; text-align: center;">
                        <span style="font-size: 13px; color: #fff; display: block; margin-bottom: 8px;">
                            Duel Request From: <br><strong id="incoming-peer-id" style="color: #ffcc00; font-size: 11px; word-break: break-all;"></strong>
                        </span>
                        <div style="display: flex; gap: 8px;">
                            <button onclick="acceptDuel()" style="background: #43b581; padding: 6px; font-size: 13px;">Accept</button>
                            <button onclick="declineDuel()" style="background: #f04747; padding: 6px; font-size: 13px;">Decline</button>
                        </div>
                    </div>

                    <div id="online-status" style="color: #f2ca5c; font-size: 13px; text-align: center; font-weight: bold; margin-top: 5px;">Not connected</div>
                </div>

                <div class="control-group" id="diff-container">
                    <label for="difficulty">Bot Difficulty</label>
                    <select id="difficulty" onchange="playUiSound(); resetGame()">
                        <option value="easy">Easy</option>
                        <option value="normal" selected>Normal</option>
                        <option value="hard">Hard</option>
                        <option value="impossible">Impossible (Tactical Lookahead)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="time-control">Time Control</label>
                    <select id="time-control" onchange="playUiSound(); toggleCustomTime(); resetGame()">
                        <option value="0">No Timer (Casual)</option>
                        <option value="1">Bullet (1 min)</option>
                        <option value="5">Blitz (5 min)</option>
                        <option value="10" selected>Rapid (10 min)</option>
                        <option value="60">Classical (1 Hour)</option>
                        <option value="custom">Custom Time...</option>
                    </select>
                    <div id="custom-time-container" style="display:none; margin-top:5px; flex-direction:row; gap:5px;">
                        <input type="number" id="custom-hours" placeholder="Hrs" value="0" min="0" max="24" onchange="resetGame()">
                        <input type="number" id="custom-minutes" placeholder="Min" value="3" min="0" max="59" onchange="resetGame()">
                        <input type="number" id="custom-seconds" placeholder="Sec" value="0" min="0" max="59" onchange="resetGame()">
                    </div>
                </div>

                <div class="control-group">
                    <label for="player-color">Choose Color</label>
                    <select id="player-color" onchange="playUiSound(); resetGame()">
                        <option value="w">White</option>
                        <option value="b">Black</option>
                        <option value="random">Random (Luck)</option>
                    </select>
                </div>

                <label class="checkbox-container">
                    <input type="checkbox" id="soundToggle" checked onchange="playUiSound()"> Enable Sounds
                </label>

                <button id="restart-btn" onclick="playUiSound(); resetGame()">Restart Game</button>
                <button id="resign-btn" onclick="playUiSound(); resignGame()" style="background: #f04747; display: none;">Resign Game</button>
                <button id="review-btn" onclick="playUiSound(); prepareAnalysis()">Analyze Game</button>
            </div>

            <div class="review-controls" id="review-controls" style="display: none;">
                <button class="nav-btn" onclick="playUiSound(); stepReview(-1)">⬅ Previous Move</button>
                <span id="review-counter" style="font-weight: bold; font-size: 18px; text-align: center; padding: 5px 0;">Move 0</span>
                <button class="nav-btn" onclick="playUiSound(); stepReview(1)">Next Move ➡</button>
                <button onclick="playUiSound(); resetGame()" style="margin-top: 10px;">Exit Analysis</button>
            </div>
            
            <div id="review-panel" class="review-panel" style="display: none;">
                <div id="opening-name" style="color: #7289da; font-size: 14px; margin-bottom: 8px;"></div>
                <span id="review-actor" style="color: white; font-size: 15px; display:block; margin-bottom: 5px;"></span>
                <span id="review-text"></span>
            </div>

            <div class="history-section" id="history-section">
                <h3 style="margin-top: 0; text-align: center; color: #ffcc00; margin-bottom: 12px; font-size: 16px;">Local Match History</h3>
                <div class="stats-container">
                    <div>White: <span id="stat-white" style="color: #43b581;">0</span></div>
                    <div>Black: <span id="stat-black" style="color: #f2ca5c;">0</span></div>
                    <div>Draws: <span id="stat-draws" style="color: #7289da;">0</span></div>
                </div>
                <div id="history-list" class="history-list"></div>
                <button onclick="playUiSound(); clearAllHistory()" style="background: #f04747; margin-top: 10px; font-size: 13px; padding: 6px;">Clear History</button>
            </div>

        </div>
    </div>

    <script>
        const game = new Chess();
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        
        const reviewPanelEl = document.getElementById('review-panel');
        const reviewTextEl = document.getElementById('review-text');
        const reviewActorEl = document.getElementById('review-actor');
        const historySectionEl = document.getElementById('history-section');
        
        let selectedSquare = null;
        let validTargetSquares = [];

        let gameFens = [];
        let gameEvals = [];
        let gameNotationMoves = [];
        let gameLastMoves = [];
        let gameTimesWhite = [];
        let gameTimesBlack = [];
        let suggestedMoves = [];
        
        let isReviewMode = false;
        let isAnalyzing = false;
        let reviewIndex = 0;
        let gameSaved = false;
        let lastMoveTimestamp = 0;

        let timerWhite = 0; 
        let timerBlack = 0; 
        let lastUpdateTime = 0; 
        let useTimer = false;
        let timerInterval = null;
        let gameActive = false;
        
        let playingColor = 'w'; 

        // PeerJS Online Multiplayer Variables
        let peer = null;
        let onlineConn = null;
        let isOnlineHost = false;

        const piecesMap = { 'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚' };

        const chessOpenings = {
            "e4": "King's Pawn Game",
            "e4 e5": "Open Game",
            "e4 e5 Nf3": "King's Knight Opening",
            "e4 e5 Nf3 Nc6": "Open Game: Normal Line",
            "e4 e5 Nf3 Nc6 Bb5": "Ruy Lopez",
            "e4 e5 Nf3 Nc6 Bc4": "Italian Game",
            "e4 c5": "Sicilian Defense",
            "e4 e6": "French Defense",
            "e4 c6": "Caro-Kann Defense",
            "d4": "Queen's Pawn Game",
            "d4 d5 c4": "Queen's Gambit",
            "d4 Nf6": "Indian Defense",
            "c4": "English Opening",
            "Nf3": "Zukertort / Réti Opening"
        };

        function getOpeningName(moves) {
            let currentSequence = "";
            let bestMatch = "Standard Development";
            for (let i = 0; i < moves.length && i < 12; i++) {
                currentSequence += (currentSequence ? " " : "") + moves[i];
                if (chessOpenings[currentSequence]) bestMatch = chessOpenings[currentSequence];
            }
            return bestMatch;
        }

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!document.getElementById('soundToggle').checked) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'move') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gainNode.gain.setValueAtTime(0.5, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'capture') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                gainNode.gain.setValueAtTime(0.8, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'check') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(500, now); osc.frequency.setValueAtTime(350, now + 0.1); 
                gainNode.gain.setValueAtTime(0.4, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now); osc.stop(now + 0.35);
            } else if (type === 'end') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'button') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            }
        }

        function playUiSound() { playSound('button'); }
        function handleGameSound(moveObj) {
            if (game.in_checkmate() || game.in_draw()) playSound('end');
            else if (game.in_check()) playSound('check');
            else if (moveObj.captured) playSound('capture');
            else playSound('move');
        }

        // ==========================================
        // ONLINE MULTIPLAYER PEERJS LOGIC (FIXED)
        // ==========================================
        
        function initPeerJS() {
            peer = new Peer();
            peer.on('open', id => {
                document.getElementById('my-peer-id').innerText = id;
            });
            peer.on('connection', conn => {
                onlineConn = conn;
                isOnlineHost = true;
                setupOnlineConnection(true);
            });
        }

        function copyPeerId() {
            playUiSound();
            const idText = document.getElementById('my-peer-id').innerText;
            if (idText !== "Loading...") {
                navigator.clipboard.writeText(idText);
                alert("Your Online ID has been copied to your clipboard. Send it to your friend!");
            }
        }

        function connectToFriend() {
            const id = document.getElementById('friend-id-input').value.trim();
            if (!id) return;
            document.getElementById('online-status').innerText = "Sending Duel Request...";
            document.getElementById('online-status').style.color = "#f2ca5c";
            
            onlineConn = peer.connect(id);
            isOnlineHost = false;
            setupOnlineConnection(false);
        }

        function setupOnlineConnection(isHost) {
            onlineConn.on('open', () => {
                if (isHost) {
                    // Display Accept/Decline Dialog instead of immediate game start
                    document.getElementById('online-status').innerText = "Duel request received!";
                    document.getElementById('online-status').style.color = "#f2ca5c";
                    document.getElementById('incoming-peer-id').innerText = onlineConn.peer;
                    document.getElementById('duel-request-panel').style.display = "block";
                } else {
                    document.getElementById('online-status').innerText = "Duel request sent! Waiting for response...";
                    document.getElementById('online-status').style.color = "#f2ca5c";
                }
            });

            onlineConn.on('data', data => {
                if (data.type === 'decline') {
                    document.getElementById('online-status').innerText = "Duel request declined by opponent.";
                    document.getElementById('online-status').style.color = "#f04747";
                    onlineConn = null;
                }
                else if (data.type === 'start') {
                    playingColor = data.hostColor === 'w' ? 'b' : 'w';
                    
                    document.getElementById('time-control').value = data.timeControl;
                    if (data.timeControl === 'custom') {
                        document.getElementById('custom-hours').value = data.cH;
                        document.getElementById('custom-minutes').value = data.cM;
                        document.getElementById('custom-seconds').value = data.cS;
                    }
                    toggleCustomTime();
                    
                    // Activate game engine parameters
                    gameActive = true;
                    resetGame();
                    
                    document.getElementById('online-status').innerText = "Duel accepted! Match in progress.";
                    document.getElementById('online-status').style.color = "#43b581";
                } 
                else if (data.type === 'move') {
                    if (useTimer && gameActive) updateTimeOnMove();
                    const moveResult = game.move(data.move);
                    if (moveResult) {
                        recordMove(moveResult);
                        handleGameSound(moveResult);
                        if (useTimer && !timerInterval) startTimer();
                    }
                    drawBoard();
                    updateStatus();
                    updateClockUI();
                }
                else if (data.type === 'resign') {
                    handleOpponentResign();
                }
            });

            onlineConn.on('close', () => {
                document.getElementById('online-status').innerText = "Disconnected from opponent.";
                document.getElementById('online-status').style.color = "#f04747";
                document.getElementById('duel-request-panel').style.display = "none";
                document.getElementById('resign-btn').style.display = "none";
                onlineConn = null;
                gameActive = false;
            });
        }

        function acceptDuel() {
            playUiSound();
            if (!onlineConn) return;

            document.getElementById('duel-request-panel').style.display = "none";
            document.getElementById('online-status').innerText = "Connected! Match Synchronized.";
            document.getElementById('online-status').style.color = "#43b581";

            let selColor = document.getElementById('player-color').value;
            if (selColor === 'random') {
                selColor = Math.random() < 0.5 ? 'w' : 'b';
            }
            playingColor = selColor;
            
            // Send match details to guest side
            onlineConn.send({
                type: 'start',
                hostColor: playingColor,
                timeControl: document.getElementById('time-control').value,
                cH: document.getElementById('custom-hours').value,
                cM: document.getElementById('custom-minutes').value,
                cS: document.getElementById('custom-seconds').value
            });

            gameActive = true;
            resetGame();
        }

        function declineDuel() {
            playUiSound();
            if (onlineConn) {
                onlineConn.send({ type: 'decline' });
                onlineConn.close();
            }
            document.getElementById('duel-request-panel').style.display = "none";
            document.getElementById('online-status').innerText = "Request declined.";
            document.getElementById('online-status').style.color = "#f04747";
        }

        function handleOpponentResign() {
            if (game.game_over() || isReviewMode || isAnalyzing || !gameActive) return;
            gameActive = false;
            clearInterval(timerInterval);
            timerInterval = null;
            playSound('end');
            
            let winnerColorStr = playingColor === 'w' ? 'White' : 'Black';
            let loserColorStr = playingColor === 'w' ? 'Black' : 'White';
            
            statusEl.innerHTML = `Game over, opponent (${loserColorStr}) resigned. You win!`;
            document.getElementById('resign-btn').style.display = "none";
            document.getElementById('review-btn').style.display = "block"; 
            
            if (!gameSaved) {
                gameSaved = true;
                saveGameToHistory(`${winnerColorStr} Wins (Opponent Resigned)`);
            }
            updateClockUI();
        }

        // ==========================================
        // GAME LOGIC & UI (FIXED)
        // ==========================================

        function toggleGameMode() {
            const mode = document.getElementById('mode').value;
            document.getElementById('diff-container').style.display = (mode === 'bot') ? 'flex' : 'none';
            document.getElementById('online-container').style.display = (mode === 'online') ? 'flex' : 'none';
            
            if (mode === 'online' && !peer) {
                initPeerJS();
            }
            gameActive = (mode !== 'online'); // Delay active loop for online modes until handshake completes
            resetGame();
        }

        function toggleCustomTime() {
            const val = document.getElementById('time-control').value;
            document.getElementById('custom-time-container').style.display = (val === 'custom') ? 'flex' : 'none';
        }

        function formatTime(ms) {
            let totalSeconds = Math.ceil(ms / 1000);
            if (totalSeconds < 0) totalSeconds = 0;
            let h = Math.floor(totalSeconds / 3600);
            let m = Math.floor((totalSeconds % 3600) / 60);
            let s = totalSeconds % 60;
            let res = '';
            if (h > 0) res += h + ':';
            res += (m < 10 && h > 0 ? '0' + m : m) + ':';
            res += (s < 10 ? '0' + s : s);
            return res;
        }

        function setupTimers() {
            clearInterval(timerInterval);
            timerInterval = null;
            const val = document.getElementById('time-control').value;
            let totalMs = 0;
            
            if (val === '0') {
                useTimer = false;
                document.getElementById('top-clock').style.display = 'none';
                document.getElementById('bottom-clock').style.display = 'none';
                return;
            } else if (val === 'custom') {
                const h = parseInt(document.getElementById('custom-hours').value) || 0;
                const m = parseInt(document.getElementById('custom-minutes').value) || 0;
                const s = parseInt(document.getElementById('custom-seconds').value) || 0;
                totalMs = (h * 3600 + m * 60 + s) * 1000;
                if (totalMs <= 0) totalMs = 60000; 
            } else {
                totalMs = parseInt(val) * 60 * 1000;
            }
            
            useTimer = true;
            timerWhite = totalMs;
            timerBlack = totalMs;
            
            document.getElementById('top-clock').style.display = 'flex';
            document.getElementById('bottom-clock').style.display = 'flex';
            updateClockUI();
        }

        function updateClockUI() {
            if (!useTimer) return;
            const isFlipped = (playingColor === 'b');
            const mode = document.getElementById('mode').value;
            
            const topTimeEl = document.getElementById('top-time');
            const bottomTimeEl = document.getElementById('bottom-time');
            const topLabelEl = document.getElementById('top-player-label');
            const bottomLabelEl = document.getElementById('bottom-player-label');
            
            if (mode === 'bot') {
                topLabelEl.innerText = isFlipped ? "Bot (White)" : "Bot (Black)";
                bottomLabelEl.innerText = isFlipped ? "You (Black)" : "You (White)";
            } else if (mode === 'online') {
                topLabelEl.innerText = isFlipped ? "Opponent (White)" : "Opponent (Black)";
                bottomLabelEl.innerText = isFlipped ? "You (Black)" : "You (White)";
            } else {
                topLabelEl.innerText = isFlipped ? "White" : "Black";
                bottomLabelEl.innerText = isFlipped ? "Black" : "White";
            }
            
            let topTimeMs = isFlipped ? timerWhite : timerBlack;
            let bottomTimeMs = isFlipped ? timerBlack : timerWhite;

            if (isReviewMode && gameTimesWhite && gameTimesWhite[reviewIndex] !== undefined) {
                const revTimeW = gameTimesWhite[reviewIndex];
                const revTimeB = gameTimesBlack[reviewIndex];
                topTimeMs = isFlipped ? revTimeW : revTimeB;
                bottomTimeMs = isFlipped ? revTimeB : revTimeW;
            }

            topTimeEl.innerText = formatTime(topTimeMs);
            bottomTimeEl.innerText = formatTime(bottomTimeMs);
            
            document.getElementById('top-clock').classList.remove('active-clock');
            document.getElementById('bottom-clock').classList.remove('active-clock');
            topTimeEl.classList.remove('low-time');
            bottomTimeEl.classList.remove('low-time');
            
            if (gameActive && !game.game_over() && !isReviewMode && !isAnalyzing) {
                if (game.turn() === 'w') {
                    if (isFlipped) document.getElementById('top-clock').classList.add('active-clock');
                    else document.getElementById('bottom-clock').classList.add('active-clock');
                } else {
                    if (isFlipped) document.getElementById('bottom-clock').classList.add('active-clock');
                    else document.getElementById('top-clock').classList.add('active-clock');
                }
            }
            
            if (topTimeMs <= 30000 && topTimeMs > 0) topTimeEl.classList.add('low-time');
            if (bottomTimeMs <= 30000 && bottomTimeMs > 0) bottomTimeEl.classList.add('low-time');
        }

        function startTimer() {
            if (!useTimer) return;
            lastUpdateTime = Date.now();

            timerInterval = setInterval(() => {
                if (!gameActive || game.game_over() || isReviewMode || isAnalyzing) {
                    clearInterval(timerInterval); timerInterval = null; return;
                }
                const delta = Date.now() - lastUpdateTime;
                lastUpdateTime = Date.now();

                if (game.turn() === 'w') {
                    timerWhite -= delta;
                    if (timerWhite <= 0) { timerWhite = 0; handleTimeout('w'); }
                } else {
                    timerBlack -= delta;
                    if (timerBlack <= 0) { timerBlack = 0; handleTimeout('b'); }
                }
                updateClockUI();
            }, 100); 
            updateClockUI();
        }

        function updateTimeOnMove() {
            if (!useTimer || !gameActive) return;
            const delta = Date.now() - lastUpdateTime;
            lastUpdateTime = Date.now();
            if (game.turn() === 'w') {
                timerWhite -= delta;
                if (timerWhite <= 0) { timerWhite = 0; handleTimeout('w'); }
            } else {
                timerBlack -= delta;
                if (timerBlack <= 0) { timerBlack = 0; handleTimeout('b'); }
            }
            updateClockUI();
        }

        function handleTimeout(loserColor) {
            gameActive = false;
            clearInterval(timerInterval);
            timerInterval = null;
            playSound('end');
            
            let winnerColorStr = loserColor === 'w' ? 'Black' : 'White';
            statusEl.innerHTML = `Game over, ${winnerColorStr} wins on time.`;
            document.getElementById('review-btn').style.display = "block"; 
            document.getElementById('resign-btn').style.display = "none";
            
            if (!gameSaved) {
                gameSaved = true;
                saveGameToHistory(`${winnerColorStr} Wins (Timeout)`);
            }
            updateClockUI();
        }

        function resignGame() {
            if (game.game_over() || isReviewMode || isAnalyzing || !gameActive) return;
            
            gameActive = false;
            clearInterval(timerInterval);
            timerInterval = null;
            playSound('end');

            const mode = document.getElementById('mode').value;
            if (mode === 'online' && onlineConn) {
                onlineConn.send({ type: 'resign' });
            }
            
            let winnerColorStr = playingColor === 'w' ? 'Black' : 'White';
            let loserColorStr = playingColor === 'w' ? 'White' : 'Black';
            
            statusEl.innerHTML = `Game over, you (${loserColorStr}) resigned. ${winnerColorStr} wins.`;
            document.getElementById('resign-btn').style.display = "none";
            document.getElementById('review-btn').style.display = "block"; 
            
            if (!gameSaved) {
                gameSaved = true;
                saveGameToHistory(`${winnerColorStr} Wins (Resignation)`);
            }
            updateClockUI();
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            validTargetSquares = [];
            isReviewMode = false;
            isAnalyzing = false;
            gameSaved = false;
            lastMoveTimestamp = Date.now();
            
            const mode = document.getElementById('mode').value;
            const selColor = document.getElementById('player-color').value;

            // Handle validation color parameters across local frameworks
            if (mode !== 'online') {
                gameActive = true; 
                if (selColor === 'random') {
                    playingColor = Math.random() < 0.5 ? 'w' : 'b';
                } else {
                    playingColor = selColor;
                }
            }
            
            setupTimers();

            gameFens = [game.fen()];
            gameEvals = [0]; 
            gameNotationMoves = [""];
            gameLastMoves = [null];
            gameTimesWhite = [timerWhite];
            gameTimesBlack = [timerBlack];
            suggestedMoves = [];

            document.getElementById('main-title').innerText = "Standard Chess (Tactical Grandmaster Engine)";
            document.getElementById('game-controls').style.display = "flex";
            document.getElementById('review-controls').style.display = "none";
            document.getElementById('review-btn').style.display = "none";
            
            // Only toggle visual layout variables if a real gameplay engine is initialized
            if (gameActive) {
                document.getElementById('resign-btn').style.display = "block";
            } else {
                document.getElementById('resign-btn').style.display = "none";
            }

            reviewPanelEl.style.display = "none";
            historySectionEl.style.display = "flex";
            
            drawBoard();
            updateStatus();
            updateHistoryUI();

            if (mode === 'bot' && playingColor === 'b' && game.turn() === 'w') {
                makeBotMove();
            }
            if (gameActive && useTimer) {
                startTimer();
            }
        }

        function recordMove(moveObj) {
            gameFens.push(game.fen());
            gameNotationMoves.push(moveObj.san);
            gameLastMoves.push({ from: moveObj.from, to: moveObj.to, color: moveObj.color });
            gameTimesWhite.push(timerWhite);
            gameTimesBlack.push(timerBlack);
            lastMoveTimestamp = Date.now();
            gameEvals.push(0); 
        }

        function drawBoard() {
            boardEl.innerHTML = '';
            const board = game.board(); 
            const isFlipped = (playingColor === 'b');
            
            const rankLabelsEl = document.getElementById('rank-labels');
            const fileLabelsEl = document.getElementById('file-labels');
            let ranksHTML = '', filesHTML = '';
            for(let i = 0; i < 8; i++) {
                ranksHTML += `<div>${isFlipped ? (i + 1) : (8 - i)}</div>`;
                const fileStr = String.fromCharCode('a'.charCodeAt(0) + (isFlipped ? (7 - i) : i));
                filesHTML += `<div>${fileStr}</div>`;
            }
            rankLabelsEl.innerHTML = ranksHTML;
            fileLabelsEl.innerHTML = filesHTML;

            const currentIndex = isReviewMode ? reviewIndex : (gameFens.length - 1);
            const lastMove = gameLastMoves[currentIndex];
            const timeSinceMove = Date.now() - lastMoveTimestamp;
            let showOutline = isReviewMode || isAnalyzing || timeSinceMove <= 1000;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const chessJsRow = isFlipped ? (7 - r) : r;
                    const chessJsCol = isFlipped ? (7 - c) : c;
                    
                    const fileChar = String.fromCharCode('a'.charCodeAt(0) + chessJsCol);
                    const rankChar = 8 - chessJsRow;
                    const squareId = fileChar + rankChar;
                    
                    const square = document.createElement('div');
                    const isLight = (chessJsCol + rankChar) % 2 === 0;
                    
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.id = squareId;
                    
                    if (selectedSquare === squareId) square.classList.add('selected');
                    if (validTargetSquares.includes(squareId)) square.classList.add('valid-move');
                    
                    if (lastMove && (squareId === lastMove.from || squareId === lastMove.to) && showOutline) {
                        if (lastMove.color === 'w') square.classList.add('last-move-white');
                        else square.classList.add('last-move-black');
                    }

                    const piece = board[chessJsRow][chessJsCol];
                    if (piece) {
                        const pieceSpan = document.createElement('span');
                        pieceSpan.className = `piece ${piece.color === 'w' ? 'white-piece' : 'black-piece'}`;
                        pieceSpan.innerHTML = piecesMap[piece.type];
                        square.appendChild(pieceSpan);
                    }
                    
                    if(!isReviewMode && !isAnalyzing) {
                        square.onclick = () => handleSquareClick(squareId);
                    }
                    boardEl.appendChild(square);
                }
            }
        }

        function handleSquareClick(squareId) {
            initAudio(); 
            if (game.game_over() || isReviewMode || isAnalyzing || !gameActive || (useTimer && (timerWhite === 0 || timerBlack === 0))) return;
            
            const mode = document.getElementById('mode').value;
            if (mode === 'bot' && game.turn() !== playingColor) return;
            if (mode === 'online' && game.turn() !== playingColor) return;

            const pieceOnSquare = game.get(squareId);

            if (selectedSquare && validTargetSquares.includes(squareId)) {
                if (useTimer && gameActive) updateTimeOnMove();

                const moveResult = game.move({ from: selectedSquare, to: squareId, promotion: 'q' });
                
                if (moveResult) {
                    recordMove(moveResult); 
                    handleGameSound(moveResult);
                    
                    if (mode === 'online' && onlineConn) {
                        onlineConn.send({ type: 'move', move: moveResult.san });
                    }
                    if (useTimer && !timerInterval) startTimer();
                }

                selectedSquare = null;
                validTargetSquares = [];
                drawBoard();
                updateStatus();
                updateClockUI();

                if (mode === 'bot' && !game.game_over()) {
                    makeBotMove();
                }
            } else {
                if (pieceOnSquare && pieceOnSquare.color === game.turn()) {
                    selectedSquare = squareId;
                    validTargetSquares = game.moves({ square: squareId, verbose: true }).map(m => m.to);
                } else {
                    selectedSquare = null;
                    validTargetSquares = [];
                }
                drawBoard(); 
            }
        }

        function updateStatus() {
            if (useTimer && (timerWhite === 0 || timerBlack === 0)) return; 
            let statusHTML = '';
            let moveColor = game.turn() === 'w' ? 'White' : 'Black';

            if (game.in_checkmate()) {
                statusHTML = `Game over, ${moveColor} is in checkmate.`;
                document.getElementById('review-btn').style.display = "block"; 
                document.getElementById('resign-btn').style.display = "none";
                gameActive = false;
                if(!gameSaved) {
                    gameSaved = true;
                    saveGameToHistory(game.turn() === 'w' ? 'Black Wins' : 'White Wins');
                }
            }
            else if (game.in_draw()) {
                statusHTML = 'Game over, drawn position.';
                document.getElementById('review-btn').style.display = "block"; 
                document.getElementById('resign-btn').style.display = "none";
                gameActive = false;
                if(!gameSaved) {
                    gameSaved = true;
                    saveGameToHistory('Draw');
                }
            }
            else {
                statusHTML = `${moveColor} to move`;
                if (game.in_check()) statusHTML += ' (Check!)';
            }

            let currentMoves = gameNotationMoves.slice(1);
            if (currentMoves.length > 0) {
                let openingName = getOpeningName(currentMoves);
                statusHTML += `<div style="color: #7289da; font-size: 14px; margin-top: 6px; font-weight: normal;">Opening: ${openingName}</div>`;
            }
            statusEl.innerHTML = statusHTML;
        }

        // ==========================================
        // HISTORY & REVIEW ENGINE
        // ==========================================

        function saveGameToHistory(resultText) {
            const modeSelect = document.getElementById('mode').value;
            let setupMode = modeSelect === 'friend' ? `Local Friend` : 
                            modeSelect === 'online' ? `Online Multiplayer` : 
                            `Bot (${document.getElementById('difficulty').value})`;
            
            const matchRecord = {
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                mode: setupMode, result: resultText,
                fens: [...gameFens], moves: [...gameNotationMoves], lastMoves: [...gameLastMoves],
                timesWhite: [...gameTimesWhite], timesBlack: [...gameTimesBlack],
                suggestedMoves: []
            };

            let history = JSON.parse(localStorage.getItem('html_chess_history')) || [];
            history.unshift(matchRecord);
            localStorage.setItem('html_chess_history', JSON.stringify(history));
            updateHistoryUI();
        }

        function updateHistoryUI() {
            const history = JSON.parse(localStorage.getItem('html_chess_history')) || [];
            const listEl = document.getElementById('history-list');
            let whiteWins = 0, blackWins = 0, draws = 0;
            listEl.innerHTML = '';

            if (history.length === 0) listEl.innerHTML = '<div style="text-align:center; color:#99aab5; font-size:13px; padding: 15px;">No matches found.</div>';

            history.forEach((match, index) => {
                if (match.result.includes('White Wins')) whiteWins++;
                else if (match.result.includes('Black Wins')) blackWins++;
                else if (match.result === 'Draw') draws++;

                const item = document.createElement('div');
                item.className = 'history-item';
                if (match.result.includes('White Wins')) item.style.borderColor = '#43b581';
                else if (match.result.includes('Black Wins')) item.style.borderColor = '#f2ca5c';
                else item.style.borderColor = '#7289da';

                item.innerHTML = `
                    <div class="history-item-details">
                        <strong style="color: #ffcc00; font-size: 14px;">${match.result}</strong>
                        <span style="font-size:11px; color:#b9bbbe;">${match.mode} • ${match.date}</span>
                    </div>
                    <div class="history-actions">
                        <button class="btn-small" onclick="playUiSound(); reviewPastGame(${index})">Rev</button>
                        <button class="btn-small btn-delete" onclick="playUiSound(); deleteGameFromHistory(${index})">Del</button>
                    </div>
                `;
                listEl.appendChild(item);
            });

            document.getElementById('stat-white').innerText = whiteWins;
            document.getElementById('stat-black').innerText = blackWins;
            document.getElementById('stat-draws').innerText = draws;
        }

        function deleteGameFromHistory(index) {
            let history = JSON.parse(localStorage.getItem('html_chess_history')) || [];
            history.splice(index, 1);
            localStorage.setItem('html_chess_history', JSON.stringify(history));
            updateHistoryUI();
        }

        function clearAllHistory() {
            if (confirm("Permanently erase all local game history?")) {
                localStorage.removeItem('html_chess_history');
                updateHistoryUI();
            }
        }

        function prepareAnalysis(isFromHistory = false, historyIndex = -1) {
            if (isAnalyzing || gameFens.length <= 1) return;
            isAnalyzing = true;
            gameActive = false;
            clearInterval(timerInterval);
            timerInterval = null;
            
            document.getElementById('main-title').innerText = "Engine Calculating Tactical Lines...";
            document.getElementById('game-controls').style.display = "none";
            document.getElementById('review-controls').style.display = "none";
            historySectionEl.style.display = "none";
            reviewPanelEl.style.display = "none";
            
            suggestedMoves = new Array(gameFens.length).fill(null);
            gameEvals = new Array(gameFens.length).fill(0);
            let i = 1;

            function analyzeNextMove() {
                if (i >= gameFens.length) {
                    isAnalyzing = false;
                    let history = JSON.parse(localStorage.getItem('html_chess_history')) || [];
                    if (isFromHistory && historyIndex !== -1 && history[historyIndex]) {
                        history[historyIndex].suggestedMoves = suggestedMoves;
                    } else if (gameSaved && history.length > 0) {
                        history[0].suggestedMoves = suggestedMoves;
                    }
                    localStorage.setItem('html_chess_history', JSON.stringify(history));
                    startReview();
                    return;
                }

                let percent = Math.round((i / (gameFens.length - 1)) * 100);
                statusEl.innerHTML = `Analyzing Blunders... ${percent}%`;

                game.load(gameFens[i - 1]); let evalB = evaluateBoardSimple();
                game.load(gameFens[i]);     let evalA = evaluateBoardSimple();
                gameEvals[i-1] = evalB; gameEvals[i] = evalA;

                let turnBefore = game.load(gameFens[i - 1]) ? game.turn() : 'w';
                let evalDiff = (turnBefore === 'w') ? (evalB - evalA) : (evalA - evalB);
                let pawnDiff = evalDiff / 100;

                if (pawnDiff > 1.2) suggestedMoves[i] = "Engine Disagrees";
                else suggestedMoves[i] = "None";

                i++;
                setTimeout(analyzeNextMove, 10); 
            }
            analyzeNextMove();
        }

        function evaluateBoardSimple() {
            let evalScore = 0; const board = game.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        const vals = { 'p': 100, 'n': 320, 'b': 330, 'r': 500, 'q': 900, 'k': 20000 };
                        evalScore += piece.color === 'w' ? vals[piece.type] : -vals[piece.type];
                    }
                }
            }
            return evalScore;
        }

        function reviewPastGame(index) {
            let history = JSON.parse(localStorage.getItem('html_chess_history')) || [];
            let match = history[index];
            if (!match) return;

            gameFens = match.fens;
            gameNotationMoves = match.moves;
            gameLastMoves = match.lastMoves || new Array(gameFens.length).fill(null);
            gameTimesWhite = match.timesWhite || new Array(gameFens.length).fill(0);
            gameTimesBlack = match.timesBlack || new Array(gameFens.length).fill(0);
            
            useTimer = gameTimesWhite.length > 0 && gameTimesWhite[0] > 0;
            if (useTimer) {
                document.getElementById('top-clock').style.display = 'flex';
                document.getElementById('bottom-clock').style.display = 'flex';
            } else {
                document.getElementById('top-clock').style.display = 'none';
                document.getElementById('bottom-clock').style.display = 'none';
            }

            if (match.suggestedMoves && match.suggestedMoves.length === gameFens.length) {
                suggestedMoves = match.suggestedMoves;
                startReview();
            } else {
                prepareAnalysis(true, index); 
            }
        }

        function startReview() {
            isReviewMode = true;
            gameActive = false;
            clearInterval(timerInterval);
            timerInterval = null;
            reviewIndex = 0; 
            
            document.getElementById('main-title').innerText = "Tactical Game Review";
            document.getElementById('game-controls').style.display = "none";
            document.getElementById('review-controls').style.display = "flex";
            historySectionEl.style.display = "none";
            
            selectedSquare = null;
            validTargetSquares = [];
            
            updateClockUI();
            renderReviewState();
        }

        function stepReview(direction) {
            reviewIndex += direction;
            if (reviewIndex < 0) reviewIndex = 0;
            if (reviewIndex >= gameFens.length) reviewIndex = gameFens.length - 1;
            renderReviewState();
        }

        function renderReviewState() {
            game.load(gameFens[reviewIndex]);
            drawBoard();
            
            document.getElementById('review-counter').innerText = `Move ${reviewIndex} of ${gameFens.length - 1}`;

            let currentMoves = gameNotationMoves.slice(1, reviewIndex + 1);
            let openingName = getOpeningName(currentMoves);
            document.getElementById('opening-name').innerText = reviewIndex > 0 ? `Opening: ${openingName}` : "";

            if (reviewIndex === 0) {
                reviewPanelEl.style.display = "block";
                reviewActorEl.innerText = "Game Setup";
                reviewTextEl.innerHTML = "Starting Position";
                reviewPanelEl.className = "review-panel";
                statusEl.innerHTML = `Opening Layout`;
                updateClockUI(); return;
            }

            game.load(gameFens[reviewIndex - 1]);
            let turnBefore = game.turn();
            game.load(gameFens[reviewIndex]);

            let evalBefore = gameEvals[reviewIndex - 1] || 0;
            let evalAfter = gameEvals[reviewIndex] || 0;
            let rawMovePlayed = gameNotationMoves[reviewIndex]; 

            let evalDiff = (turnBefore === 'w') ? (evalBefore - evalAfter) : (evalAfter - evalBefore);
            let pawnDiff = evalDiff / 100;
            let feedback = "", fClass = "";
            
            if (pawnDiff <= 0.4) { feedback = "Best Strategic Move ⭐"; fClass = "best"; }
            else if (pawnDiff <= 1.2) { feedback = "Good Choice 👍"; fClass = "good"; }
            else if (pawnDiff <= 2.5) { feedback = "Inaccuracy Found ⁉️"; fClass = "inaccuracy"; }
            else if (pawnDiff <= 4.5) { feedback = "Tactical Mistake ❓"; fClass = "mistake"; }
            else { feedback = "Critical Blunder! ❌"; fClass = "blunder"; }
            
            reviewPanelEl.style.display = "block";
            reviewActorEl.innerText = turnBefore === 'w' ? `White Played: ${rawMovePlayed}` : `Black Played: ${rawMovePlayed}`;
            reviewPanelEl.className = `review-panel ${fClass}`;
            statusEl.innerHTML = `Reviewing Move ${reviewIndex}`;
            reviewTextEl.innerHTML = feedback;

            if (useTimer && gameTimesWhite && gameTimesWhite[reviewIndex] !== undefined) {
                let timeStr = `W: ${formatTime(gameTimesWhite[reviewIndex])} | B: ${formatTime(gameTimesBlack[reviewIndex])}`;
                reviewTextEl.innerHTML += `<br><span style="font-size: 12px; color: #ffcc00; margin-top: 6px; display: inline-block;">⏱️ ${timeStr}</span>`;
            }
            updateClockUI();
        }

        // ==========================================
        // BOT ENGINE (WEB WORKER)
        // ==========================================

        function makeBotMove() {
            if (game.game_over()) return;
            statusEl.innerHTML = "Bot calculation in progress...";

            const difficulty = document.getElementById('difficulty').value;
            let thinkDelay = difficulty === 'impossible' ? 10 : 400;

            setTimeout(() => {
                if (game.game_over() || isReviewMode || isAnalyzing || document.getElementById('mode').value === 'online') return;
                
                aiWorker.postMessage({ fen: game.fen(), difficulty: difficulty });
                
                aiWorker.onmessage = function(e) {
                    if (game.game_over() || isReviewMode || isAnalyzing) return;
                    
                    const { bestMove } = e.data;
                    if (!bestMove) return;

                    if (useTimer && gameActive) updateTimeOnMove();

                    const botMoveResult = game.move(bestMove);
                    if (botMoveResult) {
                        recordMove(botMoveResult); 
                        handleGameSound(botMoveResult);
                        if (useTimer && !timerInterval) startTimer();
                    }

                    drawBoard();
                    updateStatus();
                    updateClockUI();
                };
            }, thinkDelay);
        }

        const workerCode = `
            importScripts('https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js');
            const openingBook = {
                "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq -": "e4",
                "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq -": "c5"
            };
            function getPieceValue(piece) {
                const vals = { 'p': 100, 'n': 325, 'b': 335, 'r': 500, 'q': 925, 'k': 20000 };
                return piece.color === 'w' ? vals[piece.type] : -vals[piece.type];
            }
            function evalBoard(gameInst) {
                let s = 0; const b = gameInst.board();
                for(let r=0; r<8; r++) for(let c=0; c<8; c++) if(b[r][c]) s += getPieceValue(b[r][c]);
                return s;
            }
            function getMoves(gameInst) {
                return gameInst.moves({ verbose: true }).sort((a,b) => {
                    let score = 0;
                    if(a.captured) score += 100;
                    if(a.san.includes('+')) score += 50;
                    return score > 0 ? -1 : 1;
                });
            }
            function minimax(gameInst, depth, alpha, beta, isMax, sTime, mTime) {
                if (Date.now() - sTime > mTime) return isMax ? -Infinity : Infinity;
                if (depth === 0 || gameInst.game_over()) return evalBoard(gameInst);
                const moves = getMoves(gameInst);
                if (isMax) {
                    let best = -Infinity;
                    for (let m of moves) {
                        gameInst.move(m);
                        best = Math.max(best, minimax(gameInst, depth-1, alpha, beta, false, sTime, mTime));
                        gameInst.undo();
                        alpha = Math.max(alpha, best);
                        if (beta <= alpha) break;
                    }
                    return best;
                } else {
                    let best = Infinity;
                    for (let m of moves) {
                        gameInst.move(m);
                        best = Math.min(best, minimax(gameInst, depth-1, alpha, beta, true, sTime, mTime));
                        gameInst.undo();
                        beta = Math.min(beta, best);
                        if (beta <= alpha) break;
                    }
                    return best;
                }
            }

            self.onmessage = function(e) {
                const { fen, difficulty } = e.data;
                const gameInst = new Chess(fen);
                const moves = getMoves(gameInst);
                if (moves.length === 0) return self.postMessage({ bestMove: null });

                let fenKey = fen.split(' ').slice(0, 4).join(' ');
                if (openingBook[fenKey]) {
                    let m = moves.find(x => x.san === openingBook[fenKey]);
                    if(m) return self.postMessage({ bestMove: m });
                }

                let bestMove = moves[Math.floor(Math.random() * moves.length)];
                if (difficulty !== 'easy') {
                    let sTime = Date.now(), mTime = 3000, depth = difficulty === 'impossible' ? 3 : 2;
                    let isBotW = gameInst.turn() === 'w';
                    let bestVal = isBotW ? -Infinity : Infinity;
                    for (let m of moves) {
                        gameInst.move(m);
                        let val = minimax(gameInst, depth-1, -Infinity, Infinity, !isBotW, sTime, mTime);
                        gameInst.undo();
                        if (isBotW) { if (val > bestVal) { bestVal = val; bestMove = m; } }
                        else { if (val < bestVal) { bestVal = val; bestMove = m; } }
                    }
                }
                self.postMessage({ bestMove });
            };
        `;

        const aiBlob = new Blob([workerCode], { type: 'application/javascript' });
        const aiWorker = new Worker(URL.createObjectURL(aiBlob));

        // Initialization
        toggleGameMode();
    </script>
</body>
